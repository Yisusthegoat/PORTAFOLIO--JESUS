<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Jesus Antonio Ñahuinripa Zamudio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
    }

    .info h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      line-height: 1.2;
    }

    .info h1 span {
      color: #38bdf8;
    }

    .info p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-linkedin {
      background-color: #0077b5;
      color: white;
    }

    .btn-linkedin:hover {
      background-color: #005885;
    }

    .btn-outline {
      border: 1px solid #475569;
      color: #e2e8f0;
    }

    .btn-outline:hover {
      border-color: #94a3b8;
      background-color: #1e293b;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      background-color: #0f172a;
      padding: 5px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card .title {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Columna Izquierda -->
    <div class="info">
      <h1>Hola, soy <span>JESUS ANTONIO ÑAHUINRIPA ZAMUDIO</span></h1>
      <p>Estudiante de Ingeniería de Sistemas enfocado en desarrollo de software, gestión de bases de datos y soluciones tecnológicas.</p>
      
      <div class="buttons">
        <a href="https://www.linkedin.com/in/jesus-%C3%B1-zamudio-263a92313/" target="_blank" class="btn btn-linkedin">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.7a1.62 1.62 0 1 0 0 3.24 1.62 1.62 0 0 0 0-3.24z"/>
          </svg>
          LinkedIn
        </a>
        <a href="#proyectos" class="btn btn-outline">Explorar Proyectos</a>
      </div>
    </div>

    <!-- Columna Derecha (Tarjeta Avatar) -->
    <div class="card">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Jesus" alt="Avatar Jesus" class="avatar">
      <h2>JESUS ANTONIO ÑAHUINRIPA ZAMUDIO</h2>
      <p class="title">Ingeniería de Sistemas</p>
      <span class="badge">● Online</span>
    </div>
  </div>

</body>
</html>
